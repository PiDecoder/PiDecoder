diff --git a/.github/workflows/validate.yml b/.github/workflows/validate.yml
index 215b794..12071b0 100755
--- a/.github/workflows/validate.yml
+++ b/.github/workflows/validate.yml
@@ -37,3 +37,30 @@ jobs:
             --exclude='config-web.py' \
             --exclude-dir='.git' \
             .
+
+  build:
+    runs-on: ubuntu-latest
+
+    steps:
+      - name: Checkout
+        uses: actions/checkout@v4
+
+      # Same package list as scripts/install.sh, minus runtime-only tools
+      # (ffmpeg, iproute2, python3) that aren't needed to compile pidecoder.
+      - name: Install build dependencies
+        run: |
+          sudo apt-get update
+          sudo apt-get install -y --no-install-recommends \
+            build-essential \
+            cmake \
+            libgl1-mesa-dev \
+            libmpv-dev \
+            libsdl2-dev \
+            nlohmann-json3-dev \
+            pkg-config
+
+      - name: Configure
+        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
+
+      - name: Build
+        run: cmake --build build -j"$(nproc)"
