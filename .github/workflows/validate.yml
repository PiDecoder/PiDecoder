name: Validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 nodejs

      - name: Validate Python, JavaScript and JSON
        run: |
          ./scripts/validate-release.sh

      - name: Check for committed runtime secrets
        run: |
          test ! -f config/cameras.json
          test ! -f config/auth.json
          ! grep -RInE 'rtsp://[^[:space:]]+:[^[:space:]]+@' \
            --exclude='cameras.example.json' \
            --exclude-dir='.git' .
