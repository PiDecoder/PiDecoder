name: Feature request
description: Suggest a future PiDecoder improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        New features are deferred until after v1.0.0 while the release candidate is frozen.
  - type: textarea
    id: use_case
    attributes:
      label: Use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
