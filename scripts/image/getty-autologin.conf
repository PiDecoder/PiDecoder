# Connexion automatique sur tty1 (image .img préconstruite).
#
# Copié dans /etc/systemd/system/getty@tty1.service.d/ par build-image.sh,
# avec @IMAGE_USER@ remplacé par l'utilisateur de l'image.
#
# Sans ça, rien ne démarre le compositeur Wayland : un video-wall n'a ni
# clavier ni personne pour taper un mot de passe au démarrage. La première
# ligne ExecStart vide est obligatoire — sans elle, systemd ajouterait la
# nôtre à celle de l'unité d'origine au lieu de la remplacer.
#
# Conséquence assumée : quiconque a un accès physique au Pi a un shell. C'est
# le compromis habituel d'un appareil d'affichage dédié, et l'accès physique
# à la carte SD donnerait de toute façon bien plus.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin @IMAGE_USER@ --noclear %I $TERM
